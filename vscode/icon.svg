<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Aurora gradient: cyan → sage green → lavender -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#79b8d4" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#7dbf94" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a89aca" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Soft glow blur -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Aurora blur -->
    <filter id="auroraBlur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Moon glow -->
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedBg">
      <rect width="128" height="128" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="#0d1b2e"/>

  <!-- Subtle inner vignette -->
  <rect width="128" height="128" rx="22"
        fill="none"
        stroke="#0a1525"
        stroke-width="2"/>

  <g clip-path="url(#roundedBg)">

    <!-- ── Aurora waves ─────────────────────────────────────── -->

    <!-- Back wave (blurred, wider) -->
    <path d="M -4 92 C 24 78, 48 84, 64 80 C 80 76, 104 82, 132 72"
          stroke="url(#aurora)" stroke-width="10" fill="none"
          stroke-linecap="round" opacity="0.35"
          filter="url(#auroraBlur)"/>

    <!-- Mid wave -->
    <path d="M -4 96 C 22 83, 46 89, 64 85 C 82 81, 106 87, 132 76"
          stroke="url(#aurora)" stroke-width="6" fill="none"
          stroke-linecap="round" opacity="0.55"
          filter="url(#auroraBlur)"/>

    <!-- Front wave (sharpest) -->
    <path d="M -4 100 C 20 88, 44 94, 64 90 C 84 86, 108 92, 132 80"
          stroke="url(#aurora)" stroke-width="3.5" fill="none"
          stroke-linecap="round" opacity="0.9"/>

    <!-- ── Stars ────────────────────────────────────────────── -->

    <!-- Amber star (prominent) -->
    <circle cx="96" cy="24" r="2.8" fill="#c9986a" opacity="0.95" filter="url(#glow)"/>

    <!-- White/blue stars -->
    <circle cx="26" cy="30" r="1.8" fill="#b8c8de" opacity="0.85"/>
    <circle cx="110" cy="44" r="1.6" fill="#b8c8de" opacity="0.70"/>
    <circle cx="16"  cy="64" r="1.4" fill="#b8c8de" opacity="0.60"/>
    <circle cx="44"  cy="16" r="1.4" fill="#dce8f5" opacity="0.75"/>
    <circle cx="112" cy="70" r="1.2" fill="#b8c8de" opacity="0.55"/>

    <!-- Lavender star -->
    <circle cx="18"  cy="44" r="1.6" fill="#a89aca" opacity="0.75"/>

    <!-- Sage star -->
    <circle cx="104" cy="58" r="1.4" fill="#7dbf94" opacity="0.65"/>

    <!-- Tiny background stars -->
    <circle cx="58"  cy="12" r="1.0" fill="#dce8f5" opacity="0.50"/>
    <circle cx="82"  cy="18" r="0.9" fill="#dce8f5" opacity="0.45"/>
    <circle cx="34"  cy="50" r="0.9" fill="#dce8f5" opacity="0.40"/>

    <!-- ── Crescent moon ─────────────────────────────────────── -->

    <!-- Moon body -->
    <circle cx="60" cy="52" r="28"
            fill="#dce8f5"
            filter="url(#moonGlow)"/>

    <!-- Crescent cutout (matches background) -->
    <circle cx="72" cy="44" r="23" fill="#0d1b2e"/>

    <!-- Subtle moon surface shading -->
    <circle cx="60" cy="52" r="28"
            fill="none"
            stroke="#b8c8de"
            stroke-width="0.8"
            opacity="0.4"/>

  </g>
</svg>
