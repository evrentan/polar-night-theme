<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#79b8d4" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#7dbf94" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a89aca" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="auroraBlur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <clipPath id="roundedBg">
      <rect width="40" height="40" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background (slightly lighter for dark UI contexts) -->
  <rect width="40" height="40" rx="7" fill="#0f1e35"/>

  <g clip-path="url(#roundedBg)">

    <!-- Aurora waves -->
    <path d="M -2 29 C 7 24, 15 26, 20 25 C 25 24, 33 26, 42 22"
          stroke="url(#aurora)" stroke-width="3.5" fill="none"
          stroke-linecap="round" opacity="0.35"
          filter="url(#auroraBlur)"/>
    <path d="M -2 31 C 7 26, 15 28, 20 27 C 25 26, 33 28, 42 24"
          stroke="url(#aurora)" stroke-width="2" fill="none"
          stroke-linecap="round" opacity="0.55"
          filter="url(#auroraBlur)"/>
    <path d="M -2 33 C 7 28, 15 30, 20 29 C 25 28, 33 30, 42 26"
          stroke="url(#aurora)" stroke-width="1.2" fill="none"
          stroke-linecap="round" opacity="0.9"/>

    <!-- Stars -->
    <circle cx="30" cy="7"  r="1.2" fill="#c9986a" opacity="0.95"/>
    <circle cx="8"  cy="9"  r="0.8" fill="#b8c8de" opacity="0.80"/>
    <circle cx="35" cy="14" r="0.7" fill="#b8c8de" opacity="0.65"/>
    <circle cx="5"  cy="20" r="0.7" fill="#a89aca" opacity="0.70"/>
    <circle cx="13" cy="5"  r="0.6" fill="#dce8f5" opacity="0.65"/>
    <circle cx="33" cy="22" r="0.6" fill="#7dbf94" opacity="0.60"/>

    <!-- Crescent moon -->
    <circle cx="18" cy="16" r="8.8" fill="#dce8f5"/>
    <circle cx="22" cy="13" r="7.2" fill="#0f1e35"/>

  </g>
</svg>
